name: build-and-deploy

on:
  push:
    branches: [main]
  # Run for PRs against any base so the stacked chore/phase-* branches get CI
  # on every push, not only when they're rebased onto main.
  pull_request:
  # Merge queue: re-run the required checks (the `build` matrix) on the
  # queue's temporary merge commit. Jobs gated on `push`/`pull_request`
  # (runner image, deploys) skip here; deploys still run on the push to
  # main that the queue makes.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  # for the runner-image job to push to GHCR
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Cross-platform build + test. Verifies that `cargo xtask setup` and the
  # workspace itself build cleanly on every host OS we claim to support —
  # i.e. that the post-#43 Windows-support story actually holds. Docker
  # and the playground end-to-end smoke tests run only on Linux (the
  # GitHub-hosted macOS / Windows runners don't have a docker daemon
  # available, and the playground binary's runtime path is Linux-only
  # anyway via the docker:dind sandbox).
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is paused during the 2.0 landing push: its runners
        # queue for 10-40 min and gated every merge. Re-enable it (and add
        # "build (windows-latest)" back to the main ruleset's required
        # checks) before tagging 2.0. Tracked in #479.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Use bash everywhere — Windows runners ship Git Bash under the
    # `bash` shell name, so the same shell snippets work on all three
    # OSes. Default `cmd` on Windows would need separate snippets.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cache key is per-OS so the three legs don't share an index
          # (binary artifacts under target/ are platform-specific).
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playground/frontend/package-lock.json

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v4

      - name: Run cargo xtask setup (toolchain, plugin install, frontend build, runner image)
        # On macOS / Windows the docker step inside xtask skips silently
        # because docker isn't on PATH; everything else runs normally.
        run: cargo xtask setup

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        env:
          # Corpus tests use the in-process plugin path (faster than
          # spinning up a fresh runner container per case, and we're
          # not testing sandboxing here). The plugin itself was
          # installed by xtask setup.
          RV_RUNNER: local
        run: cargo test --workspace --locked

      - name: Lint plugin for unordered HashMap/HashSet iteration (clippy)
        # Their iteration order is random per process, and when it reached
        # the output, diagrams differed between runs (#211). Only the two
        # lints denied in rustviz-plugin/src/lib.rs run (banned methods are
        # in clippy.toml); clippy's other lints are off. clippy is added
        # here rather than in rust-toolchain.toml so local setups and the
        # runner image don't grow.
        if: runner.os == 'Linux'
        run: |
          rustup component add clippy
          cargo clippy -p rustviz-plugin --locked -- -A clippy::all -D clippy::disallowed_methods -D clippy::iter_over_hash_type -D unfulfilled_lint_expectations

      - name: Smoke test the playground end-to-end (production code path)
        if: runner.os == 'Linux'
        # Production's path: RV_RUNNER=sandbox -> rv-runner.sh -> the
        # plugin this run built (installed by xtask setup). Cloud Run's
        # launcher is `sandbox do`; here plain `bash` stands in
        # for it, since isolation isn't what's under test. (The docker
        # backend would run main's runner image from GHCR, not this
        # branch's plugin, so lib/plugin changes couldn't be tested
        # together.)
        env:
          RV_RUNNER: sandbox
          RV_SANDBOX_CMD: bash
          RV_RUNNER_SCRIPT: ${{ github.workspace }}/playground/runner/rv-runner.sh
          RV_WORKDIR: ${{ runner.temp }}/rv-work
        run: |
          # Use --locked to surface lockfile drift; spawn playground in the
          # background and wait for /. Then POST a small program and confirm
          # we get back both SVGs.
          (cd playground && cargo run --release --locked &) &&
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break || sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8080/submit-code \
            -H 'Content-Type: application/json' \
            -d '{"code":"fn main(){let s=String::from(\"hi\");let t=s;println!(\"{}\",t);}"}' \
            | grep -q '"code_panel"'

      - name: Smoke test rate limit (expects 429 after burst exhausted)
        if: runner.os == 'Linux'
        run: |
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:8080/submit-code \
              -H 'Content-Type: application/json' \
              -d '{"code":"fn main(){}"}')
            echo "request $i -> $code"
            if [ "$code" = "429" ]; then ok=1; break; fi
          done
          [ "$ok" = "1" ] || { echo "rate limit never engaged"; exit 1; }

  # Build the rustviz/rustviz-runner sandbox image (per-request docker
  # container that compiles user-submitted Rust) and push it to GHCR.
  # Used for local development with RV_RUNNER=docker: `cargo xtask
  # setup` pulls it when it can't build the image locally. (Production
  # no longer uses it; Cloud Run bundles the plugin in its own image.)
  #
  # Per-arch jobs run on native runners (no QEMU). Compiling
  # rustviz-plugin under user-mode QEMU was sporadically crashing
  # rustc with `signal 5 (Trace/breakpoint trap)` ~17 minutes into
  # the arm64 leg; native arm64 sidesteps that entirely and runs in
  # parallel with amd64. Each job pushes a content-addressed,
  # tagless manifest by digest; the merge job below stitches them
  # into a multi-arch manifest under the user-facing tags.
  #
  # Pushes only on real pushes to main. On PRs that touch the image's
  # inputs it builds both arches without pushing, so arm64-only breakage
  # (e.g. LLVM crashing at -O3 after a toolchain bump, #182) shows up
  # before merge rather than on main.
  #
  # The amd64 leg also smoke-tests the docker backend end to end (#213):
  # it loads the image it just built and renders one program through
  # `rustviz svg` with RV_RUNNER=docker, i.e. `run_docker` in rustviz-lib
  # with its real flags (--network=none, --read-only, tmpfs /work, ...)
  # against this branch's plugin. The `build` job can't do this: `cargo
  # xtask setup` pulls main's image from GHCR. It runs when the image's
  # inputs or rustviz-lib/ change.
  runner-image:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io
      # Lower-case so docker tag is happy on case-insensitive filesystems too.
      IMAGE_NAME: rustviz/rustviz-runner
    outputs:
      digest-amd64: ${{ steps.export-digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export-digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect image-affecting changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            -q '.[].filename')
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          affected=false
          if echo "$changed" | grep -qE '^(playground/runner/|rustviz-plugin/|rust-toolchain\.toml$|Cargo\.lock$|\.github/workflows/build\.yml$)'; then
            affected=true
          fi
          # Docker-backend smoke test (amd64 leg only): also when the
          # client side (`run_docker` in rustviz-lib) changes.
          smoke=false
          if [ "${{ matrix.arch }}" = amd64 ] && { [ "$affected" = true ] || echo "$changed" | grep -qE '^rustviz-lib/'; }; then
            smoke=true
          fi
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          if [ "$affected" = true ] || [ "$smoke" = true ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "==> runner image inputs unchanged; skipping build"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.affected == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.changes.outputs.affected == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR, no push)
        if: github.event_name == 'pull_request' && steps.changes.outputs.affected == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: playground/runner/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          # Into the local docker daemon only for the smoke test below.
          load: ${{ steps.changes.outputs.smoke == 'true' }}
          tags: rustviz-runner:ci
          # Read main's layer cache; never write it from a PR.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}

      - name: Smoke test the docker backend with this branch's image
        if: github.event_name == 'pull_request' && steps.changes.outputs.smoke == 'true'
        env:
          RV_RUNNER: docker
          RV_RUNNER_IMAGE: rustviz-runner:ci
        run: |
          # The CLI only needs rustviz-lib, which builds on stable; this
          # skips installing the pinned nightly + rustc-dev on this runner.
          cargo +stable build --locked -p rustviz-cli
          printf 'fn main() {\n    let s = String::from("hi");\n    let t = s;\n    println!("{}", t);\n}\n' \
            > "$RUNNER_TEMP/smoke.rs"
          target/debug/rustviz svg "$RUNNER_TEMP/smoke.rs" -o "$RUNNER_TEMP/smoke-out"
          grep -q 'Move from' "$RUNNER_TEMP/smoke-out/smoke.timeline.svg"

      - name: Build and push by digest
        if: github.event_name == 'push'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: playground/runner/Dockerfile
          platforms: ${{ matrix.platform }}
          # Push without a name; downstream merge job will tag the
          # multi-arch manifest. `outputs` here matches the buildx
          # docs' multi-platform pattern.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch registry cache so the two jobs don't trample
          # each other's layers.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest as workflow artifact
        if: github.event_name == 'push'
        id: export-digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          # Strip the `sha256:` prefix for the filename — easier on
          # downstream globbing — but also expose the full digest as
          # a job output so the merge step can name images by it.
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.arch }}"
          echo "digest-${{ matrix.arch }}=${digest}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: runner-image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Stitch the two per-arch digests into a single multi-arch manifest
  # under the user-facing tags (latest, sha-XXXX, branch ref). Runs
  # only after both arch builds succeed.
  runner-image-merge:
    needs: runner-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: rustviz/rustviz-runner
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: runner-image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          # imagetools create accepts one or more sources by digest
          # and points each tag at a manifest list combining them.
          digests=()
          for f in *; do
            digests+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$(cat "$f")")
          done
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            "${digests[@]}"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            "$(jq -cr '.tags[0]' <<< '${{ steps.meta.outputs.json }}')"

  # Cloud Run compile API (see playground/cloudrun/). Builds the single
  # image (toolchain + plugin + server), pushes it to Artifact Registry and
  # deploys it. Auth is keyless: GitHub's OIDC token is exchanged via
  # Workload Identity Federation for the rv-deployer service account,
  # which only accepts tokens from rustviz/rustviz on refs/heads/main.
  deploy-cloudrun:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloudrun-deploy
      cancel-in-progress: true
    env:
      IMAGE: us-central1-docker.pkg.dev/rustviz-playground/rustviz/playground
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/816769776225/locations/global/workloadIdentityPools/github/providers/rustviz
          service_account: rv-deployer@rustviz-playground.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta
      - name: docker login to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: playground/cloudrun/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=cloudrun
          cache-to: type=gha,mode=max,scope=cloudrun
      - name: deploy
        run: ./playground/cloudrun/deploy.sh "$IMAGE:${{ github.sha }}"

  # Re-deploy the rustviz/tutorial book whenever a push to main here
  # touches anything the tutorial actually depends on (the rustc plugin,
  # the mdbook preprocessor, the rustviz library, or the toolchain pin).
  # The tutorial's own deploy workflow `git clone`s rustviz/rustviz to
  # build the plugin from source, so any plugin-side change should
  # trigger a tutorial rebuild — otherwise the deployed tutorial would
  # silently lag behind the plugin until something pushes to its own
  # repo.
  #
  # Auth: GITHUB_TOKEN can't dispatch workflows in another repo, so we
  # use a PAT (TUTORIAL_DISPATCH_TOKEN) with Actions: write on
  # rustviz/tutorial. See the project README for how it was minted.
  #
  # Path filtering happens inside the job (not at the workflow `paths:`
  # level) because the workflow-level filter would skip the whole run,
  # including `build` — and we still want every push exercised by CI.
  dispatch-tutorial:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        # Need the parent commit so `git diff HEAD^ HEAD` works. The
        # default fetch-depth is 1 (shallow clone, no parent).
        with:
          fetch-depth: 2

      - name: Detect plugin-affecting changes
        id: changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD^ HEAD)
          else
            # First commit on the branch (very rare for main); treat as
            # affecting so the tutorial picks up the new baseline.
            changed=$(git ls-files)
          fi
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(rustviz-plugin/|mdbook-rustviz/|rustviz-lib/|rustviz-cli/|rust-toolchain\.toml$)'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "==> tutorial will be rebuilt"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "==> no plugin-side changes; skipping tutorial dispatch"
          fi

      - name: Trigger rustviz/tutorial deploy
        if: steps.changes.outputs.affected == 'true'
        env:
          GH_TOKEN: ${{ secrets.TUTORIAL_DISPATCH_TOKEN }}
        run: gh workflow run deploy.yml --repo rustviz/tutorial --ref master
