[package]
name = "rustviz-events"
version = "0.1.0"
edition = "2021"
description = "Telemetry event collector and usage dashboard for the RustViz tutorial and playground (not deployed)"
publish = false

[dependencies]
actix-web = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.9"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# BigQuery REST client for the dashboard (blocking; called on actix's
# blocking pool). rustls, no OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
actix-rt = "2"
