note = "Passes since rv3 P1-2: a move out of a Box's contents leaves the Box `partly` moved, not `moved`: the Box's own move path stays initialized and it still owns its allocation, which is freed when the Box is dropped (at its scope end, on an early exit, or when it is given a new Box). rustc reports a later use of the Box as E0382 \"use of moved value\", with a note that the move was of `*b`."
beyond_facts = "P4: the call's tooltip says drop frees `the String it holds`; the String is the argument"

