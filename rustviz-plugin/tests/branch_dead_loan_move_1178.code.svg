        --rv-c3: #c084fc;
        --rv-c4: #f0475e;
        --rv-c5: #4cc35a;
        --rv-c6: #2ec4b6;
        --rv-c7: #ff7ad9;
        --rv-c8: #3fdcff;
        --rv-c9: #d4b94a;
        --rv-c10: #a6e22e;
        --rv-c11: #e8e8e8;
        --rv-c12: #8c8cff;
    }
/* general setup */
    svg {
        background-color: var(--rv-bg);
    }
    
    text {
        vertical-align: baseline;
        text-anchor: start;
    }
    
    #heading {
        font-size: 24px;
        font-weight: bold;
    }
    
    #caption {
        fill: var(--rv-caption);
        font-size: 0.875em;
        font-family: "Open Sans", sans-serif;
        font-style: italic;
    }
    
    /* code related styling */
    text.code {
        fill: var(--rv-code);
        white-space: pre;
        font-family: "Source Code Pro", Consolas, "Ubuntu Mono", Menlo, "DejaVu Sans Mono", monospace, monospace !important;
        font-size: 0.875em;
    }

    text.code .kw {
        font-weight: bold;
    }

    text.code .comment {
        fill: var(--rv-comment);
        font-style: italic;
    }

    text.code .string {
        fill: var(--rv-string);
    }

    text.code .line-number {
        fill: var(--rv-line-number);
    }

    /* the line under the code a hovered element refers to (helpers.js) */
    .emph {
        stroke: var(--rv-underline);
    }

    text.label {
        font-family: "Source Code Pro", Consolas, "Ubuntu Mono", Menlo, "DejaVu Sans Mono", monospace, monospace !important;
        font-size: 0.875em;
    }
    
    /* timeline/event interaction styling */
    .solid {
        stroke-width: 5px;
    }
    
    .hollow {
        stroke-width: 1.5;
    }
    
    .dotted {
        stroke-width: 5px;
        stroke-dasharray: "2 1";
    }
    
    .extend {
        stroke-width: 1px;
        stroke-dasharray: "2 1";
    }

    /* a column while it is mutably lent out (#722): it can't be used
       until the borrow ends. A faint row of round dots, unlike the
       4px dashes of a branch arm that isn't running. */
    .lent {
        stroke-width: 2.5px;
        stroke-dasharray: 0 6;
        stroke-linecap: round;
        stroke-opacity: 0.6;
    }
    
    .functionIcon {
        paint-order: stroke;
        stroke-width: 3px;
        fill: var(--rv-bg);
        font-size: 20px;
        font-family: times;
        font-weight: lighter;
        dominant-baseline: central;
        text-anchor: start;
        font-style: italic;
    }
    
    .functionLogo {
        font-size: 20px;
        font-style: italic;
        paint-order: stroke;
        stroke-width: 3px;
        fill: var(--rv-bg) !important;
    }
    
    /* move, copy and call arrows */
    .arrow-shaft {
        stroke: var(--rv-arrow);
    }

    .arrow-head {
        fill: var(--rv-arrow);
    }

    /* flex related styling */
    .flex-container {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        flex-wrap: nowrap;
        flex-shrink: 0;
    }
    
    object.tl_panel {
        flex-grow: 1;
    }
    
    object.code_panel {
        flex-grow: 0;
    }
    
    .tooltip-trigger {
        cursor: default;
    }
    
    .tooltip-trigger:hover{
        filter: url(#glow);
    }

    /* When the cursor is anywhere inside a branch column,
       glow every element grouped under .branch-group: one dashed or
       solid stretch of the arm, not the whole arm (#626).
       Single-element hover otherwise only highlighted one of
       the two parallel sides at a time, with no feedback on
       the transparent gap between them. */
    .branch-group:hover .tooltip-trigger {
        filter: url(#glow);
    }

    /* hash based styling */
    [data-hash="0"] { fill: var(--rv-code); }
    [data-hash="1"] { fill: var(--rv-c1); stroke: var(--rv-c1); }
    [data-hash="2"] { fill: var(--rv-c2); stroke: var(--rv-c2); }
    [data-hash="3"] { fill: var(--rv-c3); stroke: var(--rv-c3); }
    [data-hash="4"] { fill: var(--rv-c4); stroke: var(--rv-c4); }
    [data-hash="5"] { fill: var(--rv-c5); stroke: var(--rv-c5); }
    [data-hash="6"] { fill: var(--rv-c6); stroke: var(--rv-c6); }
    [data-hash="7"] { fill: var(--rv-c7); stroke: var(--rv-c7); }
    [data-hash="8"] { fill: var(--rv-c8); stroke: var(--rv-c8); }
    [data-hash="9"] { fill: var(--rv-c9); stroke: var(--rv-c9); }
    [data-hash="10"] { fill: var(--rv-c10); stroke: var(--rv-c10); }
    [data-hash="11"] { fill: var(--rv-c11); stroke: var(--rv-c11); }
    [data-hash="12"] { fill: var(--rv-c12); stroke: var(--rv-c12); }
    [data-hash="13"] { fill: var(--rv-c1); stroke: var(--rv-c1); }
    [data-hash="14"] { fill: var(--rv-c2); stroke: var(--rv-c2); }
    [data-hash="15"] { fill: var(--rv-c3); stroke: var(--rv-c3); }
    [data-hash="16"] { fill: var(--rv-c4); stroke: var(--rv-c4); }

        ]]>
        </style>
    </defs>

    <g>
        <text id="caption" x="30" y="35">Hover over the visualization for more information.</text>
    </g>

