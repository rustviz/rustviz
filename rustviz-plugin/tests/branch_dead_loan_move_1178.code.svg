<svg width="697px" height="1025px" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

    <desc>vis</desc>

    <defs>
        <style type="text/css">
        <![CDATA[
        /* colour themes: every colour below is one of these properties.
       Pick a theme with data-rv-theme="light|rust|coal|navy|ayu" on
       the root <svg> or, for an inline <svg>, on any ancestor. */
    :root,
    [data-rv-theme="light"] {
        --rv-bg: #f1f1f1;
        --rv-code: #6e6b5e;
        --rv-comment: #8a8a8a;
        --rv-string: #3a6bb5;
        --rv-line-number: #aaaaaa;
        --rv-caption: #000000;
        --rv-arrow: #808080;
        --rv-drop-notch: #ffffff;
        --rv-struct-fill: #ffffff;
        --rv-struct-stroke: #000000;
        --rv-underline: currentColor;
        --rv-tooltip-bg: rgba(70, 70, 70, 0.6);
        --rv-tooltip-fg: #ffffff;
        --rv-tooltip-border: transparent;
        --rv-c1: #1893ff;
        --rv-c2: #ff7f50;
        --rv-c3: #8635ff;
        --rv-c4: #dc143c;
        --rv-c5: #0a810a;
        --rv-c6: #008080;
        --rv-c7: #ff6cce;
        --rv-c8: #00d6fc;
        --rv-c9: #b99f35;
        --rv-c10: #15a710;
        --rv-c11: #000000;
        --rv-c12: #463ae9;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-rv-theme]) {
            --rv-bg: #191f26;
            --rv-code: #c5c8c6;
            --rv-comment: #969896;
            --rv-string: #81a2be;
            --rv-line-number: #868a8e;
            --rv-caption: #bcbdd0;
            --rv-arrow: #8e9399;
            --rv-drop-notch: #191f26;
            --rv-struct-fill: #000000;
            --rv-struct-stroke: #ffffff;
            --rv-underline: #c5c8c6;
            --rv-tooltip-bg: #161923;
            --rv-tooltip-fg: #bcbdd0;
            --rv-tooltip-border: #737480;
            --rv-c1: #4aa8ff;
            --rv-c2: #ff8c61;
            --rv-c3: #c084fc;
            --rv-c4: #f0475e;
            --rv-c5: #4cc35a;
            --rv-c6: #2ec4b6;
            --rv-c7: #ff7ad9;
            --rv-c8: #3fdcff;
            --rv-c9: #d4b94a;
            --rv-c10: #a6e22e;
            --rv-c11: #e8e8e8;
            --rv-c12: #8c8cff;
        }
    }
    [data-rv-theme="rust"] {
        --rv-bg: #f6f7f6;
        --rv-code: #6e6b5e;
        --rv-comment: #6b6b66;
