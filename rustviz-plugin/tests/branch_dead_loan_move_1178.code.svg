        --rv-line-number: #818c98;
        --rv-caption: #c5c5c5;
        --rv-arrow: #8e959e;
        --rv-drop-notch: #191f26;
        --rv-struct-fill: #000000;
        --rv-struct-stroke: #ffffff;
        --rv-underline: #e6e1cf;
        --rv-tooltip-bg: #14191f;
        --rv-tooltip-fg: #c5c5c5;
        --rv-tooltip-border: #5c6773;
